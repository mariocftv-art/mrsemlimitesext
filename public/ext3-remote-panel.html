<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MR Sem Limites EXT3</title>
  <style>
    :root{--bg:#05060f;--panel:#0b1024;--line:rgba(34,211,238,.18);--cyan:#22d3ee;--pink:#ec4899;--green:#22c55e;--text:#eaf6ff;--muted:#8aa5be}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text)}
    body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 18%,rgba(34,211,238,.20),transparent 34%),radial-gradient(circle at 78% 5%,rgba(236,72,153,.18),transparent 28%),linear-gradient(180deg,#071225 0%,#05060f 45%,#050718 100%);pointer-events:none}
    .app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding:12px;gap:10px}
    .top{display:flex;align-items:center;gap:9px;min-height:42px}
    .logo{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-weight:900;color:#03101b;background:linear-gradient(135deg,var(--cyan),var(--pink));box-shadow:0 0 24px rgba(34,211,238,.35)}
    .brand b{display:block;font-size:13px}.brand span{display:block;font-size:8px;color:var(--muted);letter-spacing:3px;font-weight:800}
    .top-actions{margin-left:auto;display:flex;gap:6px;position:relative}
    .icon{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text);border-radius:9px;width:32px;height:32px;cursor:pointer}
    .menu-panel{position:absolute;right:0;top:38px;width:188px;padding:7px;border:1px solid rgba(34,211,238,.28);border-radius:12px;background:rgba(5,8,20,.98);box-shadow:0 18px 42px rgba(0,0,0,.45),0 0 24px rgba(34,211,238,.12);z-index:20;display:flex;flex-direction:column;gap:6px}
    .menu-panel.hidden{display:none}
    .menu-panel button{width:100%;border:1px solid rgba(34,211,238,.18);background:rgba(255,255,255,.045);color:var(--text);border-radius:9px;padding:9px 10px;text-align:left;font-size:12px;font-weight:800;cursor:pointer}
    .menu-panel button:hover{border-color:rgba(34,211,238,.45);background:rgba(34,211,238,.10)}
    .orb-wrap{display:flex;flex-direction:column;align-items:center;padding-top:6px}
    .orb{width:min(48vw,158px);aspect-ratio:1;border:0;border-radius:50%;cursor:pointer;background:radial-gradient(circle at 54% 54%,#24e7ff 0 10%,#30b8ff 34%,#6674ff 66%,#8b5cf6 100%);box-shadow:0 0 60px rgba(34,211,238,.38),inset -24px -26px 55px rgba(11,17,44,.28);transition:transform .2s,box-shadow .2s}
    .orb:active{transform:scale(.98)}
    .orb.listening{box-shadow:0 0 0 6px rgba(34,197,94,.18),0 0 80px rgba(34,197,94,.5),inset -24px -26px 55px rgba(11,17,44,.28)}
    .orb.speaking{box-shadow:0 0 0 6px rgba(236,72,153,.18),0 0 80px rgba(236,72,153,.5),inset -24px -26px 55px rgba(11,17,44,.28)}
    .state{margin-top:8px;text-align:center}
    .state h1{font-size:22px;line-height:1;margin:0;color:#38bdf8;text-shadow:0 0 18px rgba(56,189,248,.45);letter-spacing:.5px}
    .state p{font-size:9px;color:var(--muted);font-weight:800;letter-spacing:3px;margin:6px 0 0;text-transform:uppercase}
    .cmd{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:rgba(4,9,24,.78);border-radius:15px;padding:7px}
    .cmd input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font-size:13px}
    .cmd input::placeholder{color:rgba(234,246,255,.45)}
    .mini{border:1px solid rgba(34,211,238,.22);background:rgba(34,211,238,.07);color:var(--text);border-radius:9px;width:28px;height:28px;cursor:pointer}
    .send{border:0;background:linear-gradient(135deg,#38bdf8,#6366f1);color:white;border-radius:10px;padding:8px 10px;font-size:10px;font-weight:900;letter-spacing:.3px;cursor:pointer}
    .send.ready{background:linear-gradient(135deg,#22c55e,#16a34a);box-shadow:0 0 18px rgba(34,197,94,.5)}
    .status{min-height:16px;color:#86efac;font-size:10px;text-align:center}
    .log{flex:1;min-height:0;overflow:auto;border-top:1px solid rgba(255,255,255,.06);padding-top:10px}
    .empty{text-align:center;color:var(--muted);font-size:12px;padding-top:22px}
    .msg{max-width:92%;margin:0 0 8px;padding:9px 10px;border-radius:12px;font-size:12px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
    .msg.user{margin-left:auto;background:linear-gradient(135deg,#0ea5e9,#7c3aed);color:white}
    .msg.bot{background:rgba(255,255,255,.06);border:1px solid rgba(34,211,238,.10);color:#dff7ff}
    .msg.final{background:rgba(34,197,94,.10);border:1px solid rgba(34,197,94,.35);color:#dcfce7}
    .foot{text-align:center;color:rgba(138,165,190,.78);font-size:9px}
    .lov{color:#67e8f9;font-weight:900}
  </style>
</head>
<body>
  <main class="app">
    <header class="top">
      <div class="logo">MR</div>
      <div class="brand"><b>IA MR — Sem Limites</b><span>ASSISTENTE</span></div>
      <div class="top-actions">
        <button class="icon" id="support" title="Suporte">☎</button>
        <button class="icon" id="menu" title="Menu">⋮</button>
        <div class="menu-panel hidden" id="menuPanel">
          <button id="forceUpdate" type="button">⟳ Forçar atualização</button>
          <button id="reset" type="button">↻ Nova conversa</button>
          <button id="supportMenu" type="button">☎ Suporte</button>
        </div>
      </div>
    </header>

    <section class="orb-wrap">
      <button class="orb" id="orb" title="Toque para falar"></button>
      <div class="state"><h1 id="title">PRONTA</h1><p id="subtitle">Toque na Orbe para conversar</p></div>
    </section>

    <div class="cmd">
      <button class="mini" id="mic" title="Falar">🎤</button>
      <input id="input" placeholder="Converse com a IA MR… (diga 'pode enviar' quando quiser mandar pro Lovable)" autocomplete="off" />
      <button class="send" id="send">FALAR COM IA</button>
    </div>

    <div class="status" id="status"></div>

    <section class="log" id="log"><div class="empty">Toque na Orbe e comece a conversar</div></section>

    <footer class="foot">produto <b>MR Sem Limites</b> · Extensão <span class="lov">LOVABLE</span></footer>
  </main>

<script>
/* ---------- Bridge com o sidepanel ---------- */
const pending = new Map(); let seq = 0;
function call(command, payload={}) {
  return new Promise((resolve, reject) => {
    const requestId = 'remote_' + (++seq);
    pending.set(requestId, { resolve, reject });
    window.parent.postMessage({ requestId, command, payload }, '*');
    setTimeout(() => {
      if (pending.has(requestId)) { pending.delete(requestId); reject(new Error('Tempo esgotado: ' + command)); }
    }, command === 'lovable.sendAndRead' ? 120000 : 30000);
  });
}
window.addEventListener('message', (event) => {
  const d = event.data || {};
  if (d.requestId && pending.has(d.requestId)) {
    const p = pending.get(d.requestId); pending.delete(d.requestId);
    d.ok ? p.resolve(d.payload) : p.reject(new Error(d.error || 'Erro'));
    return;
  }
  if (d.command === 'voice.event') handleVoice(d.payload || {});
  if (d.command === 'license.revoked') setStatus('Licença expirada ou revogada.');
});

/* ---------- Estado ---------- */
const log = document.getElementById('log');
const input = document.getElementById('input');
const statusEl = document.getElementById('status');
const title = document.getElementById('title');
const subtitle = document.getElementById('subtitle');
const orb = document.getElementById('orb');
const sendBtn = document.getElementById('send');
const menuBtn = document.getElementById('menu');
const menuPanel = document.getElementById('menuPanel');

const ORBE_API = 'https://mrsemlimitesext.lovable.app/api/public/orbe-chat';
const history = []; // {role:'user'|'assistant', content}
let greeted = false;   // apresentação só na 1ª vez
let busy = false;

function setState(a, b, cls='') {
  title.textContent = a; subtitle.textContent = b;
  orb.classList.remove('listening','speaking');
  if (cls) orb.classList.add(cls);
}
function setStatus(t){ statusEl.textContent = t || ''; }
function addMsg(role, text, extra='') {
  if (log.querySelector('.empty')) log.innerHTML = '';
  const el = document.createElement('div'); el.className = 'msg ' + role + (extra?' '+extra:''); el.textContent = text;
  log.appendChild(el); log.scrollTop = log.scrollHeight;
}
function clean(t){ return String(t||'').replace(/\s+/g,' ').trim(); }

function buildConversationPrompt(userText) {
  const recent = history.slice(-10).map(m => `${m.role === 'user' ? 'Usuário' : 'IA MR'}: ${clean(m.content)}`).join('\n');
  return [
    'MODO CONVERSA DA IA MR. Não execute alterações, não edite arquivos e não use ferramentas agora.',
    'Responda como consultor especialista brasileiro, em 2 a 4 frases objetivas, para eu falar ao usuário por voz.',
    'Ajude a planejar a ideia, sugira caminhos concretos e faça uma pergunta curta se faltar informação.',
    'Quando fizer sentido, diga que ao falar “pode enviar” a IA MR monta o prompt e manda para execução.',
    '',
    'Histórico:',
    recent,
    '',
    'Última fala do usuário:',
    userText,
    '',
    'Responda somente com a fala curta da IA MR, em português do Brasil.'
  ].join('\n');
}

function buildExecutionPrompt() {
  const combined = history
    .filter(m => m.role === 'user')
    .map(m => clean(m.content))
    .filter(t => t && !isSendTrigger(t))
    .slice(-12)
    .map(t => `- ${t}`)
    .join('\n');
  return [
    'Baseado na conversa com a IA MR, monte e execute o plano abaixo no projeto atual.',
    'Implemente de forma objetiva e completa, sem quebrar nada existente. Antes de alterar, preserve o design e a lógica já funcionando.',
    '',
    'Plano combinado:',
    combined || '- Executar o plano combinado na conversa.',
    '',
    'Faça as alterações necessárias e valide o resultado no final.'
  ].join('\n');
}

/* ---------- TTS ---------- */
async function speak(text) {
  const t = clean(text); if (!t) return;
  setState('FALANDO', 'IA MR respondendo', 'speaking');
  try { await call('voice.speak', { text: t }); } catch {}
  // volta ao pronto depois de ~ tempo estimado
  const ms = Math.min(12000, 1200 + t.length * 55);
  setTimeout(() => { if (!orb.classList.contains('listening')) setState('PRONTA','Toque na Orbe para conversar'); }, ms);
}

/* ---------- Reconhecimento de voz ---------- */
async function startVoice() {
  if (busy) return;
  if (!greeted) {
    greeted = true;
    await speak('Aqui é a IA da MR Sem Limites. Estou aqui para te ajudar. Pode falar.');
    setTimeout(() => triggerListen(), 4200);
    return;
  }
  triggerListen();
}
function triggerListen() {
  setState('OUVINDO','Pode falar','listening');
  setStatus('');
  call('voice.start', { existingText: input.value || '', lang: 'pt-BR' }).catch(e => setStatus(e.message));
}
function handleVoice(msg) {
  if (msg.type === 'VOICE_STATUS' && msg.status === 'started') { setState('OUVINDO','Pode falar','listening'); }
  if (msg.type === 'VOICE_RESULT') { input.value = msg.text || ''; }
  if (msg.type === 'VOICE_STATUS' && msg.status === 'ended') {
    const t = clean(input.value);
    if (t) { send(); } else { setState('PRONTA','Toque na Orbe para conversar'); }
  }
  if (msg.type === 'VOICE_ERROR') {
    setState('PRONTA','Toque na Orbe para conversar');
    setStatus('Microfone: ' + (msg.error || 'erro'));
  }
}

/* ---------- Detecção de gatilho ---------- */
const TRIGGERS = [
  /\bpode\s+enviar\b/i, /\bpode\s+mandar\b/i, /\bpode\s+fazer\b/i,
  /\bmanda\s+(o\s+)?prompt\b/i, /\benvia\s+(pro|para\s+o)\s+lov/i,
  /\bexecuta\s+(no\s+)?lov/i, /\bfaz\s+no\s+lov/i, /\bmontar?\s+(o\s+)?prompt\b/i
];
function isSendTrigger(t){ return TRIGGERS.some(rx => rx.test(t)); }

/* ---------- Fluxo principal ---------- */
async function send() {
  if (busy) return;
  const text = clean(input.value); if (!text) { input.focus(); return; }
  input.value = ''; addMsg('user', text);
  history.push({ role:'user', content: text });
  busy = true; sendBtn.disabled = true;
  setStatus('Recebi. Enviando para o Lovable…');

  if (isSendTrigger(text)) { await enviarParaLovable(); busy = false; sendBtn.disabled = false; return; }

  setState('PENSANDO','IA MR conversando pelo Lovable…');
  const wait = document.createElement('div'); wait.className = 'msg bot'; wait.textContent = 'Pensando…';
  if (log.querySelector('.empty')) log.innerHTML = '';
  log.appendChild(wait); log.scrollTop = log.scrollHeight;

  try {
    const res = await call('lovable.sendAndRead', { message: buildConversationPrompt(text), timeoutMs: 90000, stableMs: 1200 });
    const reply = clean(res?.reply) || 'Entendi. Posso seguir nessa direção; se estiver bom, fale “pode enviar”.';
    wait.textContent = reply;
    history.push({ role:'assistant', content: reply });
    setStatus('');
    speak(reply);
    // dica sutil de próximo passo
    sendBtn.classList.add('ready'); sendBtn.textContent = 'PODE ENVIAR';
  } catch (e) {
    wait.textContent = 'Erro: ' + (e.message || e);
    setState('PRONTA','Toque na Orbe para conversar');
    setStatus('Falha ao consultar IA. Tente novamente.');
  } finally {
    busy = false; sendBtn.disabled = false;
  }
}

async function enviarParaLovable() {
  setState('MONTANDO PROMPT','Preparando envio para o Lovable');
  setStatus('Gerando prompt final…');
  const wait = document.createElement('div'); wait.className = 'msg final'; wait.textContent = 'Montando prompt final…';
  log.appendChild(wait); log.scrollTop = log.scrollHeight;

  const finalPrompt = clean(buildExecutionPrompt());
  if (!finalPrompt) { wait.textContent = 'Prompt vazio.'; return; }

  wait.textContent = '📤 Prompt final enviado ao Lovable:\n\n' + finalPrompt;
  setState('ENVIANDO','Executando no Lovable');
  setStatus('Enviando para o Lovable…');
  speak('Beleza. Já mandei o prompt pro Lovable executar.');

  try {
    const res = await call('lovable.sendAndRead', { message: finalPrompt, timeoutMs: 70000, stableMs: 1400 });
    const reply = clean(res?.reply) || 'Enviado. Acompanhe pela aba do Lovable.';
    addMsg('bot', reply);
    history.push({ role:'assistant', content: reply });
    setState('PRONTA','Toque na Orbe para conversar'); setStatus('Enviado.');
  } catch (e) {
    addMsg('bot', 'Erro ao enviar pro Lovable: ' + (e.message || e));
    setState('PRONTA','Toque na Orbe para conversar'); setStatus('');
  } finally {
    sendBtn.classList.remove('ready'); sendBtn.textContent = 'FALAR COM IA';
  }
}

/* ---------- Wire ---------- */
sendBtn.addEventListener('click', send);
input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); send(); } });
document.getElementById('mic').addEventListener('click', startVoice);
orb.addEventListener('click', startVoice);
document.getElementById('support').addEventListener('click', () => call('support.open').catch(()=>{}));
document.getElementById('supportMenu').addEventListener('click', () => call('support.open').catch(()=>{}));
menuBtn.addEventListener('click', (e) => { e.stopPropagation(); menuPanel.classList.toggle('hidden'); });
document.addEventListener('click', (e) => { if (!menuPanel.contains(e.target) && e.target !== menuBtn) menuPanel.classList.add('hidden'); });
document.getElementById('forceUpdate').addEventListener('click', async () => {
  setStatus('Forçando atualização…');
  menuPanel.classList.add('hidden');
  try { await call('extension.forceUpdate', { version: Date.now() }); return; } catch {}
  try { if ('caches' in window) { const keys = await caches.keys(); await Promise.all(keys.map(k => caches.delete(k))); } } catch {}
  const base = location.href.split('?')[0];
  location.replace(base + '?v=' + Date.now());
});
document.getElementById('reset').addEventListener('click', () => {
  history.length = 0; greeted = false;
  log.innerHTML = '<div class="empty">Toque na Orbe e comece a conversar</div>';
  sendBtn.classList.remove('ready'); sendBtn.textContent = 'FALAR COM IA';
  setStatus('Conversa reiniciada.'); setState('PRONTA','Toque na Orbe para conversar');
});
</script>
</body>
</html>
