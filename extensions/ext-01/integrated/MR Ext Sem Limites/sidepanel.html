<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>MR EXT SEM LIMITES</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#0a0613;--bg2:#110d20;--bg3:#18122e;--bg4:#1e1638;
      --border:rgba(236,72,153,0.15);--border2:rgba(236,72,153,0.3);
      --purple:#ec4899;--purple2:#3b82f6;--purple3:#f472b6;
      --text:#f0e8ff;--text2:#b39ddb;--text3:#7c6fa0;
      --success:#22c55e;--error:#ef4444;--r:12px;
    }
    /* Animations */
    @keyframes neon-glow{0%,100%{box-shadow:0 0 8px rgba(236,72,153,.5)}50%{box-shadow:0 0 18px rgba(236,72,153,.9),0 0 40px rgba(236,72,153,.3)}}
    @keyframes slide-up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @keyframes pulse-dot{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.4);opacity:.7}}
    @keyframes lic-fadeInUp{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
    @keyframes lic-float{0%,100%{transform:translateY(0) rotate(0deg)}33%{transform:translateY(-12px) rotate(1deg)}66%{transform:translateY(6px) rotate(-1deg)}}
    @keyframes lic-float2{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-18px) rotate(-2deg)}}
    @keyframes lic-orbPulse{0%,100%{transform:scale(1);opacity:.35}50%{transform:scale(1.15);opacity:.55}}
    @keyframes lic-orbPulse2{0%,100%{transform:scale(1);opacity:.25}50%{transform:scale(1.1);opacity:.45}}
    @keyframes lic-ringPulse{0%{transform:scale(.85);opacity:.6}50%{transform:scale(1.1);opacity:.15}100%{transform:scale(1.3);opacity:0}}
    @keyframes lic-ringPulse2{0%{transform:scale(.9);opacity:.4}50%{transform:scale(1.15);opacity:.1}100%{transform:scale(1.35);opacity:0}}
    @keyframes lic-shimmer{0%{transform:translateX(-100%) skewX(-15deg)}100%{transform:translateX(200%) skewX(-15deg)}}
    @keyframes lic-borderGlow{0%,100%{border-color:rgba(236,72,153,.3);box-shadow:0 0 15px rgba(236,72,153,.08)}50%{border-color:rgba(236,72,153,.55);box-shadow:0 0 25px rgba(236,72,153,.18)}}
    @keyframes lic-particleFloat1{0%{transform:translateY(0) translateX(0);opacity:0}10%{opacity:.6}90%{opacity:.6}100%{transform:translateY(-120px) translateX(20px);opacity:0}}
    @keyframes lic-particleFloat2{0%{transform:translateY(0) translateX(0);opacity:0}10%{opacity:.4}90%{opacity:.4}100%{transform:translateY(-100px) translateX(-15px);opacity:0}}
    @keyframes lic-particleFloat3{0%{transform:translateY(0) translateX(0);opacity:0}10%{opacity:.5}90%{opacity:.5}100%{transform:translateY(-140px) translateX(10px);opacity:0}}
    @keyframes lic-gradientShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
    @keyframes lic-logoGlow{0%,100%{box-shadow:0 0 20px rgba(236,72,153,.4),0 0 40px rgba(236,72,153,.15),inset 0 0 15px rgba(236,72,153,.1)}50%{box-shadow:0 0 30px rgba(236,72,153,.65),0 0 60px rgba(236,72,153,.25),inset 0 0 20px rgba(236,72,153,.15)}}
    @keyframes lic-inputFocusGlow{0%,100%{box-shadow:0 0 0 3px rgba(236,72,153,.12),0 0 20px rgba(236,72,153,.08)}50%{box-shadow:0 0 0 4px rgba(236,72,153,.2),0 0 30px rgba(236,72,153,.15)}}
    @keyframes lic-checkPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
    @keyframes lic-scanline{0%{top:-2px}100%{top:calc(100% + 2px)}}

    *{box-sizing:border-box;margin:0;padding:0}
    *::-webkit-scrollbar{width:4px}*::-webkit-scrollbar-track{background:transparent}*::-webkit-scrollbar-thumb{background:rgba(236,72,153,.2);border-radius:4px}
    html,body{width:100%;height:100vh;overflow:hidden}
    body{background:var(--bg);font-family:'Inter',-apple-system,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}

    /* ===== LICENSE SCREEN - PREMIUM ===== */
    #licenseScreen{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:28px 20px;position:relative;overflow:hidden;background:var(--bg)}

    /* Animated background gradient */
    #licenseScreen::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 30% 20%,rgba(59,130,246,.18) 0%,transparent 50%),radial-gradient(ellipse at 70% 80%,rgba(236,72,153,.12) 0%,transparent 50%),radial-gradient(ellipse at 50% 50%,rgba(88,28,195,.08) 0%,transparent 70%);z-index:0}

    /* Floating orbs */
    .lic-orb{position:absolute;border-radius:50%;filter:blur(40px);z-index:0;pointer-events:none}
    .lic-orb-1{width:160px;height:160px;background:rgba(59,130,246,.2);top:-30px;right:-40px;animation:lic-orbPulse 6s ease-in-out infinite,lic-float 8s ease-in-out infinite}
    .lic-orb-2{width:120px;height:120px;background:rgba(236,72,153,.15);bottom:10%;left:-30px;animation:lic-orbPulse2 7s ease-in-out infinite 1s,lic-float2 10s ease-in-out infinite .5s}
    .lic-orb-3{width:80px;height:80px;background:rgba(192,132,252,.12);top:40%;right:-20px;animation:lic-orbPulse 5s ease-in-out infinite 2s,lic-float 7s ease-in-out infinite 1s}

    /* Floating particles */
    .lic-particles{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
    .lic-particle{position:absolute;width:3px;height:3px;border-radius:50%;background:rgba(236,72,153,.5)}
    .lic-particle:nth-child(1){left:15%;bottom:20%;animation:lic-particleFloat1 4s ease-in-out infinite}
    .lic-particle:nth-child(2){left:75%;bottom:30%;animation:lic-particleFloat2 5s ease-in-out infinite 1s}
    .lic-particle:nth-child(3){left:40%;bottom:10%;animation:lic-particleFloat3 6s ease-in-out infinite .5s}
    .lic-particle:nth-child(4){left:85%;bottom:15%;animation:lic-particleFloat1 4.5s ease-in-out infinite 2s;width:2px;height:2px}
    .lic-particle:nth-child(5){left:25%;bottom:40%;animation:lic-particleFloat2 5.5s ease-in-out infinite 1.5s;width:2px;height:2px;background:rgba(192,132,252,.4)}
    .lic-particle:nth-child(6){left:60%;bottom:5%;animation:lic-particleFloat3 7s ease-in-out infinite 3s;width:4px;height:4px;background:rgba(59,130,246,.3)}

    /* Glassmorphism card */
    .lic-card{position:relative;z-index:1;width:100%;max-width:340px;padding:32px 24px 28px;border-radius:20px;background:rgba(17,13,32,.65);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(236,72,153,.15);animation:lic-fadeInUp .7s cubic-bezier(.16,1,.3,1) forwards,lic-borderGlow 4s ease-in-out infinite .7s;display:flex;flex-direction:column;align-items:center}

    /* Scanline effect on card */
    .lic-card::after{content:'';position:absolute;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(236,72,153,.12),transparent);animation:lic-scanline 4s linear infinite;pointer-events:none;z-index:0}

    /* Logo container with rings */
    .lic-logo-wrap{position:relative;margin-bottom:22px;animation:lic-fadeInUp .7s cubic-bezier(.16,1,.3,1) .15s both}
    .lic-logo-ring{position:absolute;border-radius:50%;border:1px solid rgba(236,72,153,.2);pointer-events:none}
    .lic-logo-ring-1{inset:-10px;animation:lic-ringPulse 3s ease-out infinite}
    .lic-logo-ring-2{inset:-20px;animation:lic-ringPulse2 3s ease-out infinite .8s}
    .lic-logo-ring-3{inset:-30px;border-color:rgba(236,72,153,.1);animation:lic-ringPulse 4s ease-out infinite 1.5s}

    .lic-logo{width:76px;height:76px;border-radius:50%;border:2px solid rgba(236,72,153,.5);padding:3px;position:relative;z-index:1;animation:lic-logoGlow 3s ease-in-out infinite;background:linear-gradient(135deg,rgba(59,130,246,.15),rgba(236,72,153,.05))}
    .lic-logo img{width:100%;height:100%;object-fit:contain;border-radius:50%}

    /* Version badge */
    .lic-version{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;background:linear-gradient(135deg,rgba(236,72,153,.12),rgba(59,130,246,.06));border:1px solid rgba(236,72,153,.2);font-size:10px;font-weight:700;color:var(--purple3);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:16px;animation:lic-fadeInUp .7s cubic-bezier(.16,1,.3,1) .25s both}

    .lic-title{font-size:22px;font-weight:800;background:linear-gradient(135deg,#e9d5ff,#f472b6,#ec4899,#3b82f6);background-size:200% 200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:lic-fadeInUp .7s cubic-bezier(.16,1,.3,1) .3s both,lic-gradientShift 4s ease infinite;margin-bottom:6px;letter-spacing:-.3px}
    .lic-sub{font-size:12.5px;color:var(--text3);margin-bottom:22px;animation:lic-fadeInUp .7s cubic-bezier(.16,1,.3,1) .35s both;letter-spacing:.2px}

    /* Security badge */
    .sec-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;background:rgba(34,197,94,.06);border:1px solid rgba(34,197,94,.18);margin-bottom:22px;font-size:11px;font-weight:600;color:var(--success);animation:lic-fadeInUp .7s cubic-bezier(.16,1,.3,1) .4s both;letter-spacing:.3px}
    .sec-badge svg{width:13px;height:13px;stroke:var(--success);animation:lic-checkPulse 2s ease-in-out infinite}

    /* Input field */
    .lic-field{width:100%;margin-bottom:12px;animation:lic-fadeInUp .7s cubic-bezier(.16,1,.3,1) .45s both}
    .lic-field label{display:block;font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:8px}
    .lic-field input{width:100%;padding:14px 16px;border-radius:var(--r);border:1.5px solid rgba(236,72,153,.2);background:rgba(24,18,46,.7);color:var(--text);font-size:14px;font-family:'SF Mono','Fira Code',monospace;text-align:center;letter-spacing:3px;text-transform:uppercase;transition:all .35s cubic-bezier(.16,1,.3,1);backdrop-filter:blur(8px)}
    .lic-field input:focus{outline:none;border-color:rgba(236,72,153,.5);animation:lic-inputFocusGlow 2s ease-in-out infinite}
    .lic-field input::placeholder{color:rgba(124,111,160,.5);letter-spacing:1.5px;font-size:13px}

    #licenseStatus{font-size:12px;min-height:18px;margin-bottom:12px;text-align:center;font-weight:600;animation:lic-fadeInUp .7s cubic-bezier(.16,1,.3,1) .5s both}

    /* Activate button with shimmer */
    .btn-activate{width:100%;padding:14px;font-size:14px;font-weight:700;border-radius:var(--r);border:none;cursor:pointer;background:linear-gradient(135deg,var(--purple2),var(--purple),#9333ea);background-size:200% 200%;color:#fff;transition:all .3s cubic-bezier(.16,1,.3,1);box-shadow:0 4px 24px rgba(236,72,153,.35),0 1px 3px rgba(0,0,0,.3);position:relative;overflow:hidden;animation:lic-fadeInUp .7s cubic-bezier(.16,1,.3,1) .55s both;letter-spacing:.5px}
    .btn-activate::after{content:'';position:absolute;top:0;left:0;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);animation:lic-shimmer 3s ease-in-out infinite 1.5s}
    .btn-activate:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(236,72,153,.5),0 2px 6px rgba(0,0,0,.3);background-size:150% 150%}
    .btn-activate:active{transform:scale(.97);box-shadow:0 2px 12px rgba(236,72,153,.3)}
    .btn-activate:disabled{background:rgba(24,18,46,.8);color:var(--text3);cursor:not-allowed;box-shadow:none;transform:none}
    .btn-activate:disabled::after{display:none}

    .lic-footer{margin-top:20px;font-size:10px;color:rgba(124,111,160,.5);animation:lic-fadeInUp .7s cubic-bezier(.16,1,.3,1) .6s both;letter-spacing:.5px}

    /* MAIN APP */
    #mainApp{display:none;flex-direction:column;height:100vh;background:var(--bg)}

    .app-header{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:linear-gradient(180deg,var(--bg2),var(--bg));border-bottom:1px solid var(--border);flex-shrink:0;gap:8px}
    .app-header-left{display:flex;align-items:center;gap:10px;min-width:0}
    .app-header-logo{width:36px;height:36px;border-radius:11px;object-fit:cover;padding:2px;background:linear-gradient(135deg,rgba(236,72,153,.35),rgba(59,130,246,.28));box-shadow:0 0 0 1px rgba(236,72,153,.35),0 0 18px rgba(236,72,153,.35),0 0 30px rgba(59,130,246,.18);animation:neon-glow 2.8s ease-in-out infinite}
    .app-header-title{font-size:14px;font-weight:800;letter-spacing:.4px;background:linear-gradient(135deg,#e9d5ff,#f472b6,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .app-header-right{display:flex;align-items:center;gap:6px}
    .app-header-brand{width:40px;height:40px;flex-shrink:0;border-radius:12px;padding:2px;background:linear-gradient(135deg,#ec4899,#3b82f6);box-shadow:0 0 16px rgba(236,72,153,.55),0 0 28px rgba(59,130,246,.35);display:grid;place-items:center;animation:neon-glow 2.6s ease-in-out infinite;position:relative}
    .app-header-brand::after{content:"";position:absolute;inset:-3px;border-radius:14px;background:conic-gradient(from 0deg,transparent 0 60%,#ec4899 78%,#3b82f6 92%,transparent 100%);z-index:-1;filter:blur(6px);opacity:.55;animation:pulse-dot 3s ease-in-out infinite}
    .app-header-brand img{width:100%;height:100%;border-radius:10px;object-fit:cover;display:block;background:var(--bg)}
    #licenseInfo{display:inline-flex;align-items:center;gap:4px;background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.2);color:var(--success);border-radius:20px;padding:3px 10px;font-size:11px;font-weight:600}
    #licenseInfo::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--success);animation:pulse-dot 2s infinite}

    .action-bar{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
    .action-btn{border-radius:20px;padding:5px 12px;font-size:11px;font-weight:600;cursor:pointer;transition:all .25s ease;border:1.5px solid transparent;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
    #publishBtn{background:linear-gradient(135deg,#059669,#10b981);color:#fff;border:none;box-shadow:0 3px 12px rgba(16,185,129,.35);font-weight:700}
    #publishBtn:hover{transform:translateY(-1px);box-shadow:0 5px 18px rgba(16,185,129,.5)}
    #downloadBtn{background:rgba(236,72,153,.06);border-color:rgba(236,72,153,.2);color:var(--purple3)}
    #downloadBtn:hover{background:rgba(236,72,153,.14);transform:translateY(-1px)}
    #removeWatermarkBtn{background:rgba(239,68,68,.05);border-color:rgba(239,68,68,.2);color:#f87171}
    #removeWatermarkBtn:hover{background:rgba(239,68,68,.14);transform:translateY(-1px)}
    #logoutBtn{background:rgba(239,68,68,.05);border-color:rgba(239,68,68,.18);color:rgba(248,113,113,.75);margin-left:auto}
    #logoutBtn:hover{background:rgba(239,68,68,.14);color:#f87171}

    .tabs-bar{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
    .tab-btn{flex:1;padding:10px;text-align:center;font-size:12px;font-weight:600;color:var(--text3);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;transition:all .2s}
    .tab-btn:hover{color:var(--purple3)}
    .tab-btn.active{color:var(--purple);border-bottom-color:var(--purple)}

    #chatPanel{flex:1;display:flex;flex-direction:column;overflow:hidden}
    #chatPanel.hidden{display:none}
    #history{flex:1;overflow-y:auto;padding:16px 12px}
    .empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text3);text-align:center;gap:6px}
    .empty-state h3{font-size:16px;color:var(--text2)}
    .empty-state p{font-size:13px}

    #quickSuggestions{display:none;flex-wrap:wrap;gap:6px;padding:6px 12px;flex-shrink:0}
    .qs-chip{background:rgba(236,72,153,.06);border:1px solid rgba(236,72,153,.18);color:var(--purple3);border-radius:16px;padding:4px 10px;font-size:11px;cursor:pointer;transition:all .2s;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .qs-chip:hover{background:rgba(236,72,153,.14)}

    .message-wrapper{margin-bottom:10px;display:flex;animation:slide-up .2s ease}
    .message-wrapper.user{justify-content:flex-end}
    .message-wrapper.bot{justify-content:flex-start}
    .bubble{max-width:85%;padding:10px 14px;border-radius:16px;font-size:13px;line-height:1.5;word-wrap:break-word;word-break:break-word;overflow-wrap:break-word;white-space:pre-wrap}
    .bubble.user{background:linear-gradient(135deg,var(--purple2),var(--purple));color:#fff;border-bottom-right-radius:4px}
    .bubble.bot{background:var(--bg3);color:var(--text);border:1px solid var(--border);border-bottom-left-radius:4px}

    #status{padding:4px 12px;font-size:11px;color:var(--text3);flex-shrink:0;min-height:16px}
    #filePreview{display:none;flex-wrap:wrap;gap:6px;padding:6px 12px;flex-shrink:0}
    .file-chip{display:flex;align-items:center;gap:4px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:4px 8px;font-size:11px;color:var(--text2)}
    .file-chip button{background:none;border:none;color:var(--error);cursor:pointer;font-size:14px;padding:0 2px}

    /* INPUT AREA - THE FIX */
    .input-area{display:flex;flex-direction:column;gap:4px;padding:8px 10px 10px;border-top:1px solid var(--border);background:var(--bg2);flex-shrink:0}
    .input-enhance-row{display:flex;justify-content:flex-end}
    #enhanceBtn{background:rgba(236,72,153,.06);border:1px solid rgba(236,72,153,.22);color:var(--purple3);border-radius:14px;padding:3px 9px;font-size:10px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:3px;transition:all .25s ease;white-space:nowrap}
    #enhanceBtn:hover{background:rgba(236,72,153,.16);border-color:rgba(236,72,153,.4);transform:translateY(-1px)}
    #enhanceBtn.loading{opacity:.6;pointer-events:none}

    .input-row{display:flex;align-items:flex-end;gap:6px}
    #attachBtn{background:rgba(236,72,153,.08);border:1.5px solid rgba(236,72,153,.28);color:var(--purple);border-radius:12px;width:38px;height:38px;min-width:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;flex-shrink:0;transition:all .25s ease}
    #attachBtn:hover{background:rgba(236,72,153,.18);transform:scale(1.06)}

    #micBtn{background:rgba(236,72,153,.08);border:1.5px solid rgba(236,72,153,.28);color:var(--purple);border-radius:12px;width:38px;height:38px;min-width:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;flex-shrink:0;transition:all .25s ease}
    #micBtn:hover{background:rgba(236,72,153,.18);transform:scale(1.06)}
    #micBtn.recording{background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.5);color:#f87171;animation:mic-pulse 1.2s ease-in-out infinite}
    @keyframes mic-pulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.3)}50%{box-shadow:0 0 0 8px rgba(239,68,68,0)}}

    #message{flex:1;min-width:0;min-height:40px;max-height:45vh;resize:none;border:1px solid var(--border2);border-radius:var(--r);background:var(--bg3);color:var(--text);padding:10px 12px;font-size:13.5px;font-family:'Inter',sans-serif;line-height:1.5;word-wrap:break-word;word-break:break-word;overflow-wrap:break-word;white-space:pre-wrap;overflow-y:auto;transition:border-color .2s}
    #message:focus{outline:none;border-color:var(--purple);box-shadow:0 0 0 3px rgba(236,72,153,.1)}
    #message::placeholder{color:var(--text3)}

    #sendBtn{background:linear-gradient(135deg,var(--purple2),var(--purple));color:#fff;border:none;border-radius:12px;width:38px;height:38px;min-width:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;flex-shrink:0;box-shadow:0 4px 18px rgba(236,72,153,.45);transition:all .25s ease}

    #sendBtn:disabled{background:rgba(236,72,153,.12);box-shadow:none;cursor:not-allowed}

    .app-footer{text-align:center;padding:6px;font-size:10px;color:var(--text3);flex-shrink:0;border-top:1px solid var(--border)}

    .banner{width:100%;flex-shrink:0;overflow:hidden;border-bottom:1px solid var(--border)}
    .banner img{width:100%;height:auto;display:block}

    /* .quick-actions e .qa-btn base — redefinidos abaixo com estilo premium */
    .quick-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 12px 10px;flex-shrink:0;border-bottom:1px solid var(--border);background:radial-gradient(ellipse at top,rgba(236,72,153,.06),transparent 70%)}
    .qa-btn{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:14px 6px 12px;background:linear-gradient(155deg,rgba(30,22,56,.85),rgba(17,13,32,.9));border:1px solid rgba(236,72,153,.22);border-radius:14px;cursor:pointer;transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease;color:var(--text);font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;text-align:center;min-height:64px;backdrop-filter:blur(8px)}
    .qa-btn::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(236,72,153,.14),rgba(59,130,246,.08));opacity:0;transition:opacity .25s ease;pointer-events:none}
    .qa-btn:hover{transform:translateY(-2px);border-color:rgba(236,72,153,.6);box-shadow:0 8px 26px -8px rgba(236,72,153,.5),0 0 0 1px rgba(236,72,153,.35) inset}
    .qa-btn:hover::before{opacity:1}
    .qa-btn:active{transform:scale(.97)}
    .qa-btn .qa-icon{position:relative;z-index:1;display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,rgba(236,72,153,.22),rgba(59,130,246,.18));border:1px solid rgba(236,72,153,.35);color:#f472b6;box-shadow:0 0 12px rgba(236,72,153,.35) inset}
    .qa-btn .qa-icon svg{width:16px;height:16px}
    .qa-btn > *{position:relative;z-index:1}
    .qa-btn.sending{opacity:.5;pointer-events:none}
    .qa-btn[data-action="corrigir"] .qa-icon{color:#f472b6;background:linear-gradient(135deg,rgba(236,72,153,.28),rgba(217,70,239,.18));border-color:rgba(236,72,153,.5)}
    .qa-btn[data-action="refatorar"] .qa-icon{color:#60a5fa;background:linear-gradient(135deg,rgba(59,130,246,.28),rgba(99,102,241,.18));border-color:rgba(59,130,246,.5)}
    .qa-btn[data-action="melhorar"] .qa-icon{color:#fde047;background:linear-gradient(135deg,rgba(250,204,21,.22),rgba(236,72,153,.18));border-color:rgba(250,204,21,.4)}
    .qa-btn[data-action="otimizar"] .qa-icon{color:#a78bfa;background:linear-gradient(135deg,rgba(139,92,246,.28),rgba(59,130,246,.18));border-color:rgba(139,92,246,.5)}
    .qa-btn[data-action="seguranca"] .qa-icon{color:#4ade80;background:linear-gradient(135deg,rgba(34,197,94,.24),rgba(20,184,166,.18));border-color:rgba(34,197,94,.45)}
    .qa-btn[data-action="responsivo"] .qa-icon{color:#22d3ee;background:linear-gradient(135deg,rgba(34,211,238,.24),rgba(59,130,246,.18));border-color:rgba(34,211,238,.45)}

    #clearBtn{background:transparent;border:1px solid rgba(255,255,255,.08);color:rgba(200,180,220,.45);border-radius:20px;padding:4px 10px;font-size:10px;cursor:pointer}

    }

    /* Very small height - hide banner */
    @media (max-height:480px){
      .banner{display:none}
      .quick-actions{grid-template-columns:repeat(6,1fr);gap:3px;padding:3px 6px}

      .app-header{padding:4px 8px}
      .action-bar{padding:3px 8px;gap:3px}
      .action-btn{padding:2px 6px;font-size:9px}
      #history{padding:6px}

      .input-enhance-row{display:none}
      .app-footer{display:none}
      .message-wrapper{margin-bottom:4px}
    }

    /* Ultra small height - hide quick actions too */
    @media (max-height:380px){
      .quick-actions{display:none}
      .action-bar{display:none}
      .app-header{padding:3px 6px}
      .app-header-title{font-size:11px}

      .bubble{padding:5px 8px;font-size:11px;border-radius:10px}

      #attachBtn,#micBtn,#sendBtn{width:30px;height:30px;min-width:30px}
      #message{min-height:30px;padding:5px 8px;font-size:12px}
    }

    /* Narrow width fixes */
    @media (max-width:350px){
      .bubble{max-width:92%;font-size:12px;padding:7px 10px}

      .action-btn{font-size:9px;padding:3px 7px}
      .app-header-title{font-size:12px}
      #licenseInfo{font-size:9px}
      .quick-actions{grid-template-columns:repeat(3,1fr);gap:3px;padding:4px 6px}

      .input-row{gap:4px}
      #attachBtn,#micBtn{width:32px;height:32px;min-width:32px}
      #sendBtn{width:34px;height:34px;min-width:34px}
      #message{padding:7px 10px;font-size:12px}
    }

    /* Very narrow width */
    @media (max-width:300px){
      .action-bar{padding:3px 6px}
      .action-btn{padding:2px 5px;font-size:8px;gap:2px}
      #clearBtn{font-size:8px;padding:2px 5px}
      .quick-actions{grid-template-columns:repeat(3,1fr);gap:2px;padding:3px 4px}
      .qa-btn{font-size:7px;min-height:34px;padding:4px 2px}

      #attachBtn,#micBtn{width:30px;height:30px;min-width:30px}
      #sendBtn{width:32px;height:32px;min-width:32px}
      #message{padding:6px 8px;font-size:11px}
    }
