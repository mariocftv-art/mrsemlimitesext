<!DOCTYPE html>
<html>
<head><title>Voice Recognition</title></head>
<body>
<script>
// Offscreen document for Web Speech API
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let silenceTimer = null;
const SILENCE_DELAY_MS = 2000;

function broadcast(data) {
  chrome.runtime.sendMessage(data).catch(() => {});
}

function clearSilenceTimer() {
  if (silenceTimer) clearTimeout(silenceTimer);
  silenceTimer = null;
}

function armSilenceTimer() {
  clearSilenceTimer();
  silenceTimer = setTimeout(() => {
    try { recognition && recognition.stop(); } catch(e) {}
  }, SILENCE_DELAY_MS);
}

chrome.runtime.onMessage.addListener((msg, sender, sendResponse) => {
  if (msg.target !== 'offscreen') return;

  if (msg.type === 'OFFSCREEN_VOICE_START') {
    // Stop any existing recognition
    if (recognition) { try { recognition.abort(); } catch(e) {} recognition = null; }

    if (!SpeechRecognition) {
      broadcast({ type: 'VOICE_ERROR', error: 'not-supported' });
      sendResponse({ ok: false });
      return;
    }

    // Request mic permission first, then start recognition
    navigator.mediaDevices.getUserMedia({ audio: true })
      .then((stream) => {
        // Got permission — stop the stream (SpeechRecognition manages its own)
        stream.getTracks().forEach(t => t.stop());

        recognition = new SpeechRecognition();
        recognition.lang = msg.lang || 'pt-BR';
        recognition.continuous = true;
        recognition.interimResults = true;

        let finalText = msg.existingText || '';

        recognition.onstart = () => {
          broadcast({ type: 'VOICE_STATUS', status: 'started' });
        };

        recognition.onresult = (event) => {
          let interim = '';
          for (let i = event.resultIndex; i < event.results.length; i++) {
            const t = event.results[i][0].transcript;
            if (event.results[i].isFinal) {
              finalText += (finalText ? ' ' : '') + t;
            } else {
              interim += t;
            }
          }
          broadcast({
            type: 'VOICE_RESULT',
            text: finalText + (interim ? ' ' + interim : ''),
            finalText: finalText
          });
          if ((finalText || interim).trim()) armSilenceTimer();
        };

        recognition.onerror = (event) => {
          if (event.error !== 'aborted') {
            broadcast({ type: 'VOICE_ERROR', error: event.error });
          }
        };

        recognition.onend = () => {
          clearSilenceTimer();
          broadcast({ type: 'VOICE_STATUS', status: 'ended', finalText });
          recognition = null;
        };

        recognition.start();
      })
      .catch((err) => {
        broadcast({ type: 'VOICE_ERROR', error: 'not-allowed' });
      });

    sendResponse({ ok: true });
    return;
  }

  if (msg.type === 'OFFSCREEN_VOICE_STOP') {
    if (recognition) { try { recognition.stop(); } catch(e) {} recognition = null; }
    clearSilenceTimer();
    sendResponse({ ok: true });
    return;
  }
});
</script>
</body>
</html>
