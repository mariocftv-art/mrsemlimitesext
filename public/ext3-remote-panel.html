<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MR Sem Limites EXT3</title>
  <style>
    :root{--bg:#05060f;--bg2:#070a18;--panel:#0b1024;--line:rgba(34,211,238,.18);--cyan:#22d3ee;--pink:#ec4899;--green:#22c55e;--text:#eaf6ff;--muted:#8aa5be;--soft:rgba(255,255,255,.06)}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text)}
    body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 18%,rgba(34,211,238,.20),transparent 34%),radial-gradient(circle at 78% 5%,rgba(236,72,153,.18),transparent 28%),linear-gradient(180deg,#071225 0%,#05060f 45%,#050718 100%);pointer-events:none}
    .app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding:12px;gap:10px;background:linear-gradient(180deg,rgba(2,6,23,.24),rgba(2,6,23,.76))}
    .top{display:flex;align-items:center;gap:9px;min-height:42px}.logo{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-weight:900;color:#03101b;background:linear-gradient(135deg,var(--cyan),var(--pink));box-shadow:0 0 24px rgba(34,211,238,.35)}
    .brand{min-width:0}.brand b{display:block;font-size:13px;letter-spacing:.2px}.brand span{display:block;font-size:8px;color:var(--muted);letter-spacing:3px;font-weight:800}.top-actions{margin-left:auto;display:flex;gap:6px}.icon{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text);border-radius:9px;width:32px;height:32px;cursor:pointer}.icon:hover{border-color:rgba(34,211,238,.42)}
    .orb-wrap{display:flex;flex-direction:column;align-items:center;padding-top:8px}.orb{width:min(58vw,188px);aspect-ratio:1;border:0;border-radius:50%;cursor:pointer;background:radial-gradient(circle at 54% 54%,#24e7ff 0 10%,#30b8ff 34%,#6674ff 66%,#8b5cf6 100%);box-shadow:0 0 70px rgba(34,211,238,.38),inset -26px -28px 60px rgba(11,17,44,.28);transition:transform .2s ease,box-shadow .2s ease}.orb:active{transform:scale(.98)}.orb.listening{box-shadow:0 0 0 6px rgba(34,197,94,.16),0 0 80px rgba(34,197,94,.5),inset -26px -28px 60px rgba(11,17,44,.28)}
    .state{margin-top:10px;text-align:center}.state h1{font-size:24px;line-height:1;margin:0;color:#38bdf8;text-shadow:0 0 18px rgba(56,189,248,.45);letter-spacing:.5px}.state p{font-size:9px;color:var(--muted);font-weight:800;letter-spacing:3px;margin:7px 0 0;text-transform:uppercase}
    .cmd{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:rgba(4,9,24,.78);border-radius:15px;padding:7px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.02)}.cmd input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font-size:13px}.cmd input::placeholder{color:rgba(234,246,255,.45)}.cmd .mini{border:1px solid rgba(34,211,238,.22);background:rgba(34,211,238,.07);color:var(--text);border-radius:9px;width:28px;height:28px;cursor:pointer}.send{border:0;background:linear-gradient(135deg,#38bdf8,#6366f1);color:white;border-radius:10px;padding:8px 10px;font-size:10px;font-weight:900;letter-spacing:.3px;cursor:pointer;box-shadow:0 0 18px rgba(99,102,241,.36)}
    .chips{display:flex;gap:6px;overflow:auto;padding-bottom:2px}.chip{flex:0 0 auto;border:1px solid rgba(236,72,153,.20);background:rgba(236,72,153,.07);color:#f9a8d4;border-radius:999px;padding:7px 9px;font-size:10px;font-weight:800;cursor:pointer}.chip.cyan{border-color:rgba(34,211,238,.22);background:rgba(34,211,238,.08);color:#67e8f9}.chip.green{border-color:rgba(34,197,94,.22);background:rgba(34,197,94,.08);color:#86efac}
    .log{flex:1;min-height:0;overflow:auto;border-top:1px solid rgba(255,255,255,.06);padding-top:10px}.empty{text-align:center;color:var(--muted);font-size:12px;padding-top:22px}.msg{max-width:92%;margin:0 0 8px;padding:9px 10px;border-radius:12px;font-size:12px;line-height:1.45;white-space:pre-wrap;word-break:break-word}.msg.user{margin-left:auto;background:linear-gradient(135deg,#0ea5e9,#7c3aed);color:white}.msg.bot{background:rgba(255,255,255,.06);border:1px solid rgba(34,211,238,.10);color:#dff7ff}.status{min-height:16px;color:#86efac;font-size:10px;text-align:center}.foot{text-align:center;color:rgba(138,165,190,.78);font-size:9px;line-height:1.45}.lov{color:#67e8f9;font-weight:900}.hidden{display:none!important}
  </style>
</head>
<body>
  <main class="app">
    <header class="top">
      <div class="logo">MR</div><div class="brand"><b>MR Sem Limites</b><span>EXTENSÃO</span></div>
      <div class="top-actions"><button class="icon" id="support" title="Suporte">☎</button><button class="icon" id="clear" title="Limpar">×</button></div>
    </header>
    <section class="orb-wrap">
      <button class="orb" id="orb" title="Clique para falar"></button>
      <div class="state"><h1 id="title">PRONTA</h1><p id="subtitle">Toque na Orbe para falar</p></div>
    </section>
    <div class="cmd"><button class="mini" id="mic" title="Falar">🎤</button><input id="input" placeholder="Digite ou fale seu comando…" autocomplete="off" /><button class="send" id="send">ATIVAR IA</button></div>
    <div class="chips"><button class="chip cyan" data-prompt="Quero planejar um dashboard moderno. Me dê ideias de layout, métricas e visual antes de montar o prompt final.">Dashboard</button><button class="chip" data-prompt="Me ajude a melhorar o visual do meu projeto com uma direção premium e profissional.">Melhorar UI</button><button class="chip green" data-prompt="Monte um prompt final detalhado com base no que conversamos e envie para o Lovable executar.">Montar prompt</button></div>
    <div class="status" id="status"></div>
    <section class="log" id="log"><div class="empty">Pronto para começar</div></section>
    <footer class="foot">produto <b>MR Sem Limites</b><br>Extensão <span class="lov">LOVABLE</span></footer>
  </main>
  <script>
    const pending = new Map(); let seq = 0; const log = document.getElementById('log'); const input = document.getElementById('input'); const statusEl = document.getElementById('status'); const title = document.getElementById('title'); const subtitle = document.getElementById('subtitle'); const orb = document.getElementById('orb');
    function call(command,payload={}){return new Promise((resolve,reject)=>{const requestId='remote_'+(++seq);pending.set(requestId,{resolve,reject});window.parent.postMessage({requestId,command,payload},'*');setTimeout(()=>{if(pending.has(requestId)){pending.delete(requestId);reject(new Error('Tempo esgotado: '+command));}},command==='lovable.sendAndRead'?90000:30000);});}
    window.addEventListener('message',(event)=>{const d=event.data||{};if(d.requestId&&pending.has(d.requestId)){const p=pending.get(d.requestId);pending.delete(d.requestId);d.ok?p.resolve(d.payload):p.reject(new Error(d.error||'Erro'));return;}if(d.command==='voice.event') handleVoice(d.payload||{});if(d.command==='chat.captured'&&d.payload?.content)addMsg('bot',d.payload.content);if(d.command==='license.revoked')setStatus('Licença expirada ou revogada.');});
    function setState(a,b,listen=false){title.textContent=a;subtitle.textContent=b;orb.classList.toggle('listening',listen)}function setStatus(t){statusEl.textContent=t||''}function addMsg(role,text){if(log.querySelector('.empty'))log.innerHTML='';const el=document.createElement('div');el.className='msg '+role;el.textContent=text;log.appendChild(el);log.scrollTop=log.scrollHeight}function clean(t){return String(t||'').replace(/\s+/g,' ').trim()}
    async function speak(t){try{await call('voice.speak',{text:t});}catch(_){}}
    async function startVoice(){setState('OUVINDO','Fale agora',true);setStatus('MR pronto pra te ajudar…');await speak('MR pronto pra te ajudar. Como posso te ajudar?');setTimeout(()=>call('voice.start',{existingText:input.value||'',lang:'pt-BR'}).catch(e=>setStatus(e.message)),1200)}
    function handleVoice(msg){if(msg.type==='VOICE_STATUS'&&msg.status==='started'){setState('OUVINDO','Pode falar',true);setStatus('');}if(msg.type==='VOICE_RESULT'){input.value=msg.text||'';input.focus();}if(msg.type==='VOICE_STATUS'&&msg.status==='ended'){setState('PRONTA','Texto capturado',false);setStatus(input.value.trim()?'Texto pronto. Toque em ATIVAR IA para conversar.':'');}if(msg.type==='VOICE_ERROR'){setState('PRONTA','Toque na Orbe para falar',false);setStatus('Microfone: '+(msg.error||'erro'));}}
    async function send(){const text=clean(input.value);if(!text){input.focus();return;}addMsg('user',text);input.value='';setState('PROCESSANDO','Aguardando resposta real do Lovable',false);setStatus('Enviando para o Lovable…');const wait=document.createElement('div');wait.className='msg bot';wait.textContent='Pensando…';if(log.querySelector('.empty'))log.innerHTML='';log.appendChild(wait);log.scrollTop=log.scrollHeight;try{const res=await call('lovable.sendAndRead',{message:text,timeoutMs:70000,stableMs:1400});const reply=clean(res?.reply)||'Recebi, mas não consegui ler a resposta completa.';wait.textContent=reply;setState('PRONTA','Toque na Orbe para falar',false);setStatus('Resposta recebida.');speak(reply.slice(0,900));}catch(e){wait.textContent='Erro: '+(e.message||e);setState('PRONTA','Toque na Orbe para falar',false);setStatus('Não consegui concluir. Verifique se a aba do Lovable está aberta.');}}
    document.getElementById('send').addEventListener('click',send);input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();send();}});document.getElementById('mic').addEventListener('click',startVoice);orb.addEventListener('click',startVoice);document.getElementById('support').addEventListener('click',()=>call('support.open').catch(()=>{}));document.getElementById('clear').addEventListener('click',()=>{log.innerHTML='<div class="empty">Pronto para começar</div>';setStatus('');});document.querySelectorAll('[data-prompt]').forEach(b=>b.addEventListener('click',()=>{input.value=b.dataset.prompt;input.focus();}));
  </script>
</body>
</html>
